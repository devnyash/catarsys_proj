version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: mysql+aiomysql://catarsys:catarsys_password_here@172.20.0.1:3306/catarsys
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_ENV: production
      CORS_ORIGINS: https://catarsys.psychoware.ru
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET}
      TELEGRAM_REDIRECT_URI: https://catarsys.psychoware.ru/auth/telegram/callback
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "172.20.0.1:host-gateway"

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://backend:8001/api/v1
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
